name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[gui,test]"
      - run: python -m pip check
      - name: Check GUI and automatic command entry points without a display
        run: |
          pyradage gui --help
          pyradage-gui --help
          pyradage auto --help
          fr2dynage --help
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel and exercise installed entry points
        run: |
          python -m venv /tmp/pyradage-wheel
          /tmp/pyradage-wheel/bin/python -m pip install --no-deps --no-index --find-links dist pyradage
          /tmp/pyradage-wheel/bin/python -m pip install 'pyradage[gui]'
          cd /tmp
          /tmp/pyradage-wheel/bin/pyradage validate "$GITHUB_WORKSPACE/examples/cygnus_a.json"
          /tmp/pyradage-wheel/bin/python -m pyradage predict "$GITHUB_WORKSPACE/examples/remnant_synthetic.json" --age-myr 30 --active-duration-myr 25 --alpha-inj 0.6 --jet-power-w 5e38
          /tmp/pyradage-wheel/bin/pyradage map-age "$GITHUB_WORKSPACE/examples/maps_demo/expansion.json" --output /tmp/expansion.fits --preview /tmp/expansion.png
          /tmp/pyradage-wheel/bin/pyradage map-age "$GITHUB_WORKSPACE/examples/maps_demo/flow.json" --output /tmp/flow.fits --preview /tmp/flow.png
          /tmp/pyradage-wheel/bin/pyradage-gui --help
          /tmp/pyradage-wheel/bin/pyradage auto --help
      - name: Create a clean source export
        run: python tools/export_github.py --output "$RUNNER_TEMP/PyRADAGE-GitHub" --zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-and-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            ${{ runner.temp }}/PyRADAGE-GitHub.zip
          if-no-files-found: error
